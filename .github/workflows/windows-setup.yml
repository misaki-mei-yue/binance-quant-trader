name: Build Windows setup.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller (thin launcher; freqtrade installed by first_run)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build launcher exe (onefile, no freqtrade bundle)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name BinanceQuantLauncher `
            --paths . `
            --add-data "user_data;user_data" `
            --add-data "launcher;launcher" `
            --add-data "requirements.txt;." `
            launcher/app.py
          if (-not (Test-Path "dist\BinanceQuantLauncher.exe")) { throw "launcher missing" }
          Get-Item "dist\BinanceQuantLauncher.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
          Get-ChildItem dist -Filter "*.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinanceQuantSetup
          path: |
            dist/BinanceQuantSetup.exe
            dist/BinanceQuantLauncher.exe

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BinanceQuantSetup.exe
            dist/BinanceQuantLauncher.exe
          generate_release_notes: true
